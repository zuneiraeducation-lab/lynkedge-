<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LynkEdge Production Control - Data Entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=status-option-list-2">
</head>
<body class="control-page">
  <main class="control-shell">
    <header class="control-header">
      <a href="/" class="back-nav-btn" title="Back to Display Board">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Display Board</span>
      </a>
      <div class="control-heading">
        <span class="heading-rule"></span>
        <h1>STATUS BOARD FOR AREA AND FIXED EQUIPMENTS AND ACCESSORIES</h1>
        <p>ENTER / UPDATE INFORMATION</p>
      </div>
      <div class="brand-block">
        <div class="brand-name">CIPLA</div>
        <div class="brand-meta">
          <span>GOA</span>
          <input id="unitNumber" name="unit_number" class="brand-unit-input" type="text" value="UNIT VII PDII" aria-label="Unit number">
        </div>
      </div>
    </header>

    <section class="board-panel">
      <form id="productionForm" class="data-form" autocomplete="off">
        <div class="entry-row">
          <label class="entry-label" data-label-key="area">Area :</label>
          <input id="area" name="area" class="field-box field-input" type="text" value="COMPRESSION-VII">
        </div>

        <div class="entry-row">
          <label class="entry-label" data-label-key="equipment_codes">Fixed Equipment &amp; Accessories Code:</label>
          <input id="equipmentCodes" name="equipment_codes" class="field-box field-input" type="text" value="TM-061.TM-021, GA-T-AC-0410, GA-T-AC-0462, GA-T-AC-0210, GA-T-AC-0446, GA-T-AC-0428, GA-T-AC-0057, GA-T-AC-0059, GA-T-AC-0416">
        </div>

        <div class="entry-row">
          <label class="entry-label" data-label-key="status">Status :</label>
          <div class="status-controls">
            <select id="status" name="status" class="status-native-select">
              <option value="" selected disabled>Select Status</option>
            </select>
            <div class="status-picker">
              <button type="button" id="statusPickerBtn" class="status-picker-btn">
                <span class="picker-btn-text">Select Status</span>
                <span class="picker-arrow">▾</span>
              </button>
              <div id="statusOptionsList" class="status-options-list hidden"></div>
            </div>
            <button type="button" id="addStatusOptionBtn" class="add-status-btn">+ Add option</button>
          </div>
        </div>

        <div class="entry-row option-row">
          <label class="entry-label radio-label" data-label-key="previous_name">
            <span id="previousNameFields" class="radio-options"></span>
          </label>
          <div class="status-controls">
            <select id="previousNameValue" name="previous_name_value" class="status-native-select">
              <option value="" selected disabled>Select an option</option>
            </select>
            <div class="status-picker" id="previousNamePicker">
              <button type="button" id="previousNamePickerBtn" class="status-picker-btn">
                <span class="picker-btn-text">Select an option</span>
                <span class="picker-arrow">▾</span>
              </button>
              <div id="previousNameOptionsList" class="status-options-list hidden"></div>
            </div>
            <button type="button" id="addPreviousNameOptionBtn" class="add-status-btn">+ Add option</button>
          </div>
        </div>

        <div class="entry-row option-row">
          <label class="entry-label radio-label" data-label-key="current_name">
            <span id="currentNameFields" class="radio-options"></span>
          </label>
          <div class="status-controls">
            <select id="currentNameValue" name="current_name_value" class="status-native-select">
              <option value="" selected disabled>Select an option</option>
            </select>
            <div class="status-picker" id="currentNamePicker">
              <button type="button" id="currentNamePickerBtn" class="status-picker-btn">
                <span class="picker-btn-text">Select an option</span>
                <span class="picker-arrow">▾</span>
              </button>
              <div id="currentNameOptionsList" class="status-options-list hidden"></div>
            </div>
            <button type="button" id="addCurrentNameOptionBtn" class="add-status-btn">+ Add option</button>
          </div>
        </div>

        <div class="entry-row option-row">
          <label class="entry-label radio-label" data-label-key="batch">
            <span id="batchFields" class="radio-options"></span>
          </label>
          <div class="status-controls">
            <select id="batchValue" name="batch_value" class="status-native-select">
              <option value="" selected disabled>Select an option</option>
            </select>
            <div class="status-picker" id="batchPicker">
              <button type="button" id="batchPickerBtn" class="status-picker-btn">
                <span class="picker-btn-text">Select an option</span>
                <span class="picker-arrow">▾</span>
              </button>
              <div id="batchOptionsList" class="status-options-list hidden"></div>
            </div>
            <button type="button" id="addBatchOptionBtn" class="add-status-btn">+ Add option</button>
          </div>
        </div>

        <div class="entry-row">
          <label class="entry-label" data-label-key="cleaning_valid_up_to">Cleaning Valid up to :</label>
          <input id="cleaningValidUpTo" name="cleaning_valid_up_to" class="field-box field-input" type="date">
        </div>

        <div class="entry-row">
          <label class="entry-label" data-label-key="clean_before_datetime">Equipment/Accessories/Area clean before date and time :</label>
          <input id="cleanBeforeDatetime" name="clean_before_datetime" class="field-box field-input" type="datetime-local">
        </div>

        <div class="entry-row">
          <label class="entry-label" data-label-key="updated_by">Status updated by :</label>
          <input id="updatedBy" name="updated_by" class="field-box field-input" type="text" placeholder="ENTER NAME">
        </div>

        <div class="entry-row">
          <label class="entry-label" data-label-key="updated_on">Status updated on :</label>
          <input id="updatedOn" name="updated_on" class="field-box field-input" type="date">
        </div>

        <div id="customRowsContainer" class="custom-rows-container"></div>

        <div class="entry-row action-row">
          <button type="button" id="addRowBtn" class="add-row-btn">+ Add Row</button>
          <button type="button" id="editLabelsBtn" class="add-row-btn hidden">Edit field names</button>
          <button type="submit" id="submitBtn" class="submit-btn">
            <span class="btn-text">Submit</span>
          </button>
        </div>
      </form>

      <div id="feedbackBanner" class="feedback-banner hidden" role="alert">
        <span class="feedback-icon" id="feedbackIcon"></span>
        <span class="feedback-text" id="feedbackText"></span>
      </div>

      <section id="accountSettingsPanel" class="account-settings hidden" aria-labelledby="accountSettingsTitle">
        <button type="button" id="changePasswordsBtn" class="change-passwords-btn">🔐 Change account passwords</button>
        <button type="button" id="changeUsernamesBtn" class="change-passwords-btn">👤 Change account usernames</button>
      </section>
    </section>
  </main>

  <div id="statusModal" class="status-modal hidden" role="dialog" aria-modal="true" aria-labelledby="statusModalTitle">
    <div class="status-modal-card">
      <button type="button" id="closeStatusModalBtn" class="close-status-modal" aria-label="Close">×</button>
      <h2 id="statusModalTitle">Add new status</h2>
      <input id="statusOptionInput" class="status-modal-input" type="text" placeholder="Type new status" autocomplete="off">
      <div class="status-modal-actions">
        <button type="button" id="cancelStatusBtn" class="cancel-status-btn">Cancel</button>
        <button type="button" id="confirmStatusBtn" class="confirm-status-btn">Add</button>
      </div>
    </div>
  </div>

  <div id="passwordModal" class="status-modal hidden" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">
    <div class="status-modal-card password-modal-card">
      <button type="button" id="closePasswordModalBtn" class="close-status-modal" aria-label="Close">×</button>
      <h2 id="passwordModalTitle">Change account passwords</h2>
      <div class="password-account-choices" role="radiogroup" aria-label="Select account">
        <label><input type="radio" name="passwordAccount" value="1" checked> Account 1</label>
        <label><input type="radio" name="passwordAccount" value="2"> Account 2</label>
        <label><input type="radio" name="passwordAccount" value="3"> Account 3</label>
      </div>
      <div class="password-fields">
        <label>New password<div class="password-input-wrap"><input id="newPasswordInput" type="password" autocomplete="new-password"><button type="button" class="password-visibility-btn" data-password-target="newPasswordInput" aria-label="Show new password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></label>
        <label>Confirm new password<div class="password-input-wrap"><input id="confirmPasswordInput" type="password" autocomplete="new-password"><button type="button" class="password-visibility-btn" data-password-target="confirmPasswordInput" aria-label="Show confirmed password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></label>
      </div>
      <div id="passwordFeedback" class="password-feedback hidden" role="alert"></div>
      <div class="status-modal-actions">
        <button type="button" id="cancelPasswordBtn" class="cancel-status-btn">Cancel</button>
        <button type="button" id="submitPasswordBtn" class="confirm-status-btn">Change password</button>
      </div>
    </div>
  </div>

  <div id="usernameModal" class="status-modal hidden" role="dialog" aria-modal="true" aria-labelledby="usernameModalTitle">
    <div class="status-modal-card username-modal-card">
      <button type="button" id="closeUsernameModalBtn" class="close-status-modal" aria-label="Close">×</button>
      <h2 id="usernameModalTitle">Change account usernames</h2>
      <div id="usernameAccountChoices" class="password-account-choices" role="radiogroup" aria-label="Select account">
        <label><input type="radio" name="usernameAccount" value="1" checked> Account 1</label>
        <label><input type="radio" name="usernameAccount" value="2"> Account 2</label>
        <label><input type="radio" name="usernameAccount" value="3"> Account 3</label>
      </div>
      <div id="usernameFields" class="username-fields"></div>
      <div id="usernameFeedback" class="password-feedback hidden" role="alert"></div>
      <div class="status-modal-actions">
        <button type="button" id="cancelUsernameBtn" class="cancel-status-btn">Cancel</button>
        <button type="button" id="submitUsernameBtn" class="confirm-status-btn">Change username</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=status-option-list-2"></script>
</body>
</html>
