<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LynkEdge Screen Presentation Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="display-mode">
  <div class="display-shell">
    <div class="display-header-row">
      <div class="display-header-left">
        <a href="/login" class="display-edit-btn" id="editDataBtn" title="Enter / Update Information">
          <svg class="edit-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>Edit</span>
        </a>
      </div>
      <div class="display-brand-block">
        <div class="display-brand-name">CIPLA</div>
        <div class="display-brand-meta">GOA</div>
        <div class="display-brand-meta small" id="displayUnitNumber">UNIT VII PDII</div>
      </div>
    </div>

    <h1 class="display-main-title">STATUS BOARD FOR AREA AND FIXED EQUIPMENTS AND ACCESSORIES</h1>

    <div class="display-board" id="displayBoard"></div>
  </div>

  <script>
    const statusUrl = '/api/status';

    function renderDisplay(data) {
      const displayBoard = document.getElementById('displayBoard');
      if (!displayBoard) return;

      const unitEl = document.getElementById('displayUnitNumber');
      if (unitEl && data.unit_number) {
        unitEl.textContent = data.unit_number;
      }

      const rows = [
        ['Area', data.area || ''],
        ['Fixed Equipment & Accessories Code', data.equipment_codes || ''],
        ['Status', data.status || ''],
        ['Previous Product Name', data.previous_product_name || ''],
        ['Previous Material Name', data.previous_material_name || ''],
        ['Product Name', data.product_name || ''],
        ['Material Name', data.material_name || ''],
        ['Batch No.', data.batch_number || ''],
        ['SAP Batch No.', data.sap_batch_number || ''],
        ['Cleaning Valid Up To', data.cleaning_valid_up_to || ''],
        ['Equipment/Accessories/Area clean before date and time', data.clean_before_datetime || ''],
        ['Status updated by', data.updated_by || ''],
        ['Status updated on', data.updated_on || '']
      ];

      const customRows = Array.isArray(data.custom_rows) ? data.custom_rows : [];
      customRows.forEach(row => {
        if (row && row.label) rows.push([row.label, row.value || '']);
      });

      const content = rows.map(([label, value]) => `
        <div class="display-row">
          <div class="display-label">${label} :</div>
          <div class="display-value">${value || 'NA'}</div>
        </div>
      `).join('');

      displayBoard.innerHTML = content;
    }

    async function fetchDisplayData() {
      try {
        const response = await fetch(statusUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        renderDisplay(data);
      } catch (error) {
        console.warn('Display sync failed:', error);
      }
    }

    fetchDisplayData();
    setInterval(fetchDisplayData, 2000);
  </script>
</body>
</html>
